name: MarketLens checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run invariant and scenario checks
        run: python scripts/run.py self-test --out-dir work/tests
      - name: Generate synthetic report
        run: python scripts/run.py demo --db work/demo.sqlite3 --out-dir work/demo-results
      - name: Verify source package includes licensing notices
        run: python scripts/build_package.py --output work/marketlens-license-check.zip
      - name: Accept packaged Skill in isolated directory and virtual environment
        run: python scripts/verify_standalone.py --output work/standalone-acceptance
