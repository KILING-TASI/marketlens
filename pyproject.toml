[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marketlens"
version = "0.5.3"
description = "市场消息与证据分析：支持范围、竞争解释与可复查的论证结构"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = []

[project.scripts]
marketlens = "marketlens._entry:main"

[tool.setuptools]
packages = ["marketlens"]
package-dir = {"marketlens" = "scripts/marketlens"}

[tool.setuptools.data-files]
"share/marketlens" = ["SHARED_CODE.json", "RIGHTS_INDEX.json", "CONTRIBUTING.md", "SECURITY.md", "LIFECYCLE.md"]

[project.optional-dependencies]
pdf = ["pypdf>=5,<7"]
