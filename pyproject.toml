[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marketlens"
version = "0.2.3"
description = "独立研究工具与完整资源；未知证据保留"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = []

[project.scripts]
marketlens = "marketlens._entry:main"

[tool.setuptools]
packages = ["marketlens"]
package-dir = {"marketlens" = "scripts/marketlens"}
